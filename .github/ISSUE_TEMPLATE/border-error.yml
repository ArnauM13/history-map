name: Una frontera, un nom o una bandera que no toca
description: El mapa ensenya alguna cosa malament en una data.
labels: [data]
body:
  - type: input
    id: link
    attributes:
      label: L'enllaç al mapa on es veu
      description: Copia l'adreça; ja porta la data.
      placeholder: https://arnaum13.github.io/history-map/?d=1938-10-01&lang=ca
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Què hi ha malament i com hauria de ser
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Fonts
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Les fronteres són les dels tractats, no les de les ocupacions (DADES.md). Les ocupacions
        aniran en una capa a part.
