name: Proposar un fet o un conflicte
description: Un fet o un conflicte que hi hauria de ser (o un que està malament).
labels: [content]
body:
  - type: markdown
    attributes:
      value: |
        Gràcies! També el pots afegir tu: és un fitxer YAML curt (CONTRIBUTING.md).

        Pots escriure en català, castellà o anglès · Puedes escribir en catalán, castellano o
        inglés · You can write in Catalan, Spanish or English.
  - type: input
    id: title
    attributes:
      label: Títol
      placeholder: Tractat de Versalles
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Data (o inici i final, si és un conflicte)
      placeholder: 1919-06-28
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Què va passar
      description: Dues o tres frases. En català, castellà o anglès.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: On
      placeholder: Versalles, França
  - type: textarea
    id: sources
    attributes:
      label: Fonts
      description: Com a mínim una (la Viquipèdia val per començar).
    validations:
      required: true
