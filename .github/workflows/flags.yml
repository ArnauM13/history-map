# Baixa de Wikimedia Commons les banderes de content/flags.yaml i en fa un commit: qui hi
# contribueix només ha de tocar el YAML.
name: Flags

on:
  push:
    paths:
      - content/flags.yaml
      - scripts/fetch-flags.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flags-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch flags
        id: fetch
        run: npm run data:flags
        continue-on-error: true
      - name: Commit the flags
        run: |
          git add public/flags
          if git diff --cached --quiet; then
            echo "Les banderes ja eren al dia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Banderes: les imatges de Wikimedia Commons, al dia"
          # «Flags» i «Fonts» corren alhora quan un push toca content/flags.yaml i la resta del
          # contingut: el segon a acabar ha d'agafar el commit del primer abans de pujar el seu.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
      - name: Missing files
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Hi ha banderes que no són a Wikimedia Commons. Els noms i els suggeriments són al pas 'Fetch flags'."
          exit 1
