# Completa els enllaços a la Viquipèdia en català i castellà dels fets i dels conflictes, a partir
# del títol anglès, i en fa un commit. Qui hi contribueix només ha de posar el títol en anglès.
name: Wikipedia

on:
  push:
    paths:
      - content/events/**
      - content/conflicts/**
      - scripts/wikipedia-links.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikipedia-${{ github.ref }}

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fill in links
        id: links
        run: npm run data:wikipedia
        continue-on-error: true
      - name: Commit the links
        run: |
          git add content
          if git diff --cached --quiet; then
            echo "Els enllaços ja eren al dia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Contingut: els enllaços a la Viquipèdia en català i castellà"
          git push
      - name: Missing articles
        if: steps.links.outcome == 'failure'
        run: |
          echo "::error::Hi ha títols que no són a la Viquipèdia anglesa. Són al pas 'Fill in links'."
          exit 1
