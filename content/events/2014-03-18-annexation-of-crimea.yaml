date: 2014-03-18
category: crisis
location: [34.100, 44.952]
countries: [365, 369]
title:
  ca: Rússia s'annexiona Crimea
  es: Rusia se anexiona Crimea
  en: Russia annexes Crimea
summary:
  ca: >-
    Després que tropes russes prenguessin el control de la península i d'un referèndum no
    reconegut, Rússia es va annexionar Crimea. L'Assemblea General de l'ONU va reafirmar la
    integritat territorial d'Ucraïna i la gran majoria d'estats no reconeixen l'annexió.
  es: >-
    Después de que tropas rusas tomaran el control de la península y de un referéndum no
    reconocido, Rusia se anexionó Crimea. La Asamblea General de la ONU reafirmó la integridad
    territorial de Ucrania y la gran mayoría de estados no reconocen la anexión.
  en: >-
    After Russian troops took control of the peninsula and an unrecognised referendum was held,
    Russia annexed Crimea. The UN General Assembly reaffirmed Ukraine's territorial integrity and
    the vast majority of states do not recognise the annexation.
wikipedia:
  en: Annexation of Crimea by the Russian Federation
sources:
  - title: 'Resolution 68/262: Territorial integrity of Ukraine'
    publisher: United Nations General Assembly
    url: https://undocs.org/A/RES/68/262
