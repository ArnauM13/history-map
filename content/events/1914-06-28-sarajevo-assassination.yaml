summary:
  ca: >-
    Gavrilo Princip, membre del grup nacionalista Jove Bòsnia, va assassinar l'arxiduc Francesc
    Ferran, hereu d'Àustria-Hongria, i la seva esposa Sofia. L'atemptat va desencadenar la crisi
    de juliol, que en poques setmanes va arrossegar les grans potències a la Primera Guerra Mundial.
  es: >-
    Gavrilo Princip, miembro del grupo nacionalista Joven Bosnia, asesinó al archiduque Francisco
    Fernando, heredero de Austria-Hungría, y a su esposa Sofía. El atentado desencadenó la crisis
    de julio, que en pocas semanas arrastró a las grandes potencias a la Primera Guerra Mundial.
  en: >-
    Gavrilo Princip, a member of the nationalist group Young Bosnia, shot Archduke Franz Ferdinand,
    heir to the Austro-Hungarian throne, and his wife Sophie. The assassination triggered the July
    Crisis, which within weeks drew the great powers into the First World War.
