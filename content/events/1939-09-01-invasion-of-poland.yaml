title:
  ca: Invasió de Polònia
  es: Invasión de Polonia
  en: Invasion of Poland
summary:
  ca: >-
    Alemanya va envair Polònia i el 3 de setembre el Regne Unit i França li van declarar la
    guerra: començava la Segona Guerra Mundial a Europa. El 17 de setembre la Unió Soviètica va
    envair el país per l'est, d'acord amb el protocol secret del pacte Molotov-Ribbentrop.
  es: >-
    Alemania invadió Polonia y el 3 de septiembre el Reino Unido y Francia le declararon la
    guerra: comenzaba la Segunda Guerra Mundial en Europa. El 17 de septiembre la Unión Soviética
    invadió el país por el este, de acuerdo con el protocolo secreto del pacto Mólotov-Ribbentrop.
  en: >-
    Germany invaded Poland, and on 3 September the United Kingdom and France declared war on it:
    the Second World War in Europe had begun. On 17 September the Soviet Union invaded from the
    east, as agreed in the secret protocol of the Molotov–Ribbentrop Pact.
