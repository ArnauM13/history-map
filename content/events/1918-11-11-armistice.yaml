title:
  ca: Armistici de Compiègne
  es: Armisticio de Compiègne
  en: Armistice of Compiègne
summary:
  ca: >-
    Alemanya i els Aliats van signar l'armistici en un vagó de tren al bosc de Compiègne, i els
    combats van acabar a les onze del matí. Àustria-Hongria ja s'havia desintegrat i el kàiser
    havia abdicat: al seu lloc naixien nous estats com Polònia, Txecoslovàquia o el Regne dels
    Serbis, Croats i Eslovens.
  es: >-
    Alemania y los Aliados firmaron el armisticio en un vagón de tren en el bosque de Compiègne, y
    los combates terminaron a las once de la mañana. Austria-Hungría ya se había desintegrado y el
    káiser había abdicado: en su lugar nacían nuevos estados como Polonia, Checoslovaquia o el
    Reino de los Serbios, Croatas y Eslovenos.
  en: >-
    Germany and the Allies signed the armistice in a railway carriage in the Forest of Compiègne,
    and fighting stopped at 11 a.m. Austria-Hungary had already fallen apart and the Kaiser had
    abdicated: new states such as Poland, Czechoslovakia and the Kingdom of Serbs, Croats and
    Slovenes were emerging in their place.
