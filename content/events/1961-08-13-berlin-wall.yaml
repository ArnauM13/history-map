  en: Construction of the Berlin Wall
summary:
  ca: >-
    Per aturar l'èxode de ciutadans cap a l'oest, la República Democràtica Alemanya va tancar la
    frontera amb Berlín Oest i va començar a aixecar un mur. Durant 28 anys va ser el símbol més
    visible del teló d'acer que dividia Europa.
  es: >-
    Para frenar el éxodo de ciudadanos hacia el oeste, la República Democrática Alemana cerró la
    frontera con Berlín Oeste y empezó a levantar un muro. Durante 28 años fue el símbolo más
    visible del telón de acero que dividía Europa.
  en: >-
    To stop the exodus of its citizens to the West, the German Democratic Republic sealed the
    border with West Berlin and began building a wall. For 28 years it was the most visible symbol
    of the Iron Curtain dividing Europe.
