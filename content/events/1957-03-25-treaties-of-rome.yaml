  ca: >-
    Bèlgica, França, Itàlia, Luxemburg, els Països Baixos i l'Alemanya Occidental van crear la
    Comunitat Econòmica Europea (CEE) i l'Euratom. És l'origen directe de l'actual Unió Europea.
  es: >-
    Bélgica, Francia, Italia, Luxemburgo, los Países Bajos y Alemania Occidental crearon la
    Comunidad Económica Europea (CEE) y el Euratom. Es el origen directo de la actual Unión Europea.
  en: >-
    Belgium, France, Italy, Luxembourg, the Netherlands and West Germany created the European
    Economic Community (EEC) and Euratom, the direct forerunners of today's European Union.
