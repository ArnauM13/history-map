title:
  ca: Mort de Franco
  es: Muerte de Franco
  en: Death of Franco
summary:
  ca: >-
    La mort del dictador Francisco Franco, al poder des de la Guerra Civil, va obrir la Transició
    espanyola. Joan Carles I va ser proclamat rei dos dies després, el 1977 es van celebrar les
    primeres eleccions democràtiques i el 1978 es va aprovar la Constitució.
  es: >-
    La muerte del dictador Francisco Franco, en el poder desde la Guerra Civil, abrió la
    Transición española. Juan Carlos I fue proclamado rey dos días después, en 1977 se celebraron
    las primeras elecciones democráticas y en 1978 se aprobó la Constitución.
  en: >-
    The death of dictator Francisco Franco, in power since the Civil War, opened Spain's transition
    to democracy. Juan Carlos I was proclaimed king two days later, the first democratic elections
    were held in 1977 and a new constitution was approved in 1978.
