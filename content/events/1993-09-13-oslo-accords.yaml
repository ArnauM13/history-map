date: 1993-09-13
category: treaty
location: [35.2, 31.9]
countries: [666, 6631, 6511]
title:
  ca: Acords d'Oslo
  es: Acuerdos de Oslo
  en: Oslo Accords
summary:
  ca: >-
    Israel i l'Organització per a l'Alliberament de Palestina es van reconèixer mútuament i van
    pactar un autogovern palestí provisional a Gaza i Cisjordània. L'acord definitiu, que havia
    d'arribar el 1999, no s'ha signat mai.
  es: >-
    Israel y la Organización para la Liberación de Palestina se reconocieron mutuamente y pactaron
    un autogobierno palestino provisional en Gaza y Cisjordania. El acuerdo definitivo, que debía
    llegar en 1999, nunca se ha firmado.
  en: >-
    Israel and the Palestine Liberation Organization recognised each other and agreed on an interim
    Palestinian self-government in Gaza and the West Bank. The final agreement, due by 1999, has
    never been signed.
