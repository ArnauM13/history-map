title:
  ca: Caiguda del Mur de Berlín
  es: Caída del Muro de Berlín
  en: Fall of the Berlin Wall
summary:
  ca: >-
    Després de setmanes de protestes, un anunci confús del govern de la RDA va portar milers de
    berlinesos als passos fronterers, que es van acabar obrint aquella mateixa nit. Va ser el
    moment culminant de les revolucions de 1989 a l'Europa de l'Est.
  es: >-
    Tras semanas de protestas, un anuncio confuso del gobierno de la RDA llevó a miles de
    berlineses a los pasos fronterizos, que acabaron abriéndose esa misma noche. Fue el momento
    culminante de las revoluciones de 1989 en Europa del Este.
  en: >-
    After weeks of protests, a confused announcement by the East German government sent thousands
    of Berliners to the border crossings, which were opened that same night. It was the climax of
    the 1989 revolutions in Eastern Europe.
