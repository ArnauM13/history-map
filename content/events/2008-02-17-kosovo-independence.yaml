date: 2008-02-17
category: independence
location: [21.166, 42.663]
countries: [347, 340]
title:
  ca: Declaració d'independència de Kosovo
  es: Declaración de independencia de Kosovo
  en: Kosovo declares independence
summary:
  ca: >-
    L'Assemblea de Kosovo, sota administració de les Nacions Unides des de 1999, va declarar la
    independència de Sèrbia. Molts estats l'han reconegut, però d'altres, com Sèrbia, Rússia o
    Espanya, no ho han fet.
  es: >-
    La Asamblea de Kosovo, bajo administración de las Naciones Unidas desde 1999, declaró la
    independencia de Serbia. Muchos estados la han reconocido, pero otros, como Serbia, Rusia o
    España, no lo han hecho.
  en: >-
    The Assembly of Kosovo, under United Nations administration since 1999, declared independence
    from Serbia. Many states have recognised it, while others, including Serbia, Russia and Spain,
    have not.
