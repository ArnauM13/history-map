date: 1905-06-07
category: independence
location: [10.739, 59.913]
countries: [385, 380]
title:
  ca: Noruega dissol la unió amb Suècia
  es: Noruega disuelve la unión con Suecia
  en: Norway dissolves its union with Sweden
summary:
  ca: >-
    El Parlament noruec (Storting) va declarar dissolta la unió personal amb Suècia, vigent des
    de 1814. Després d'un referèndum i de negociacions, Suècia en va reconèixer la independència
    a l'octubre i el príncep Carles de Dinamarca va ser coronat amb el nom d'Haakon VII.
  es: >-
    El Parlamento noruego (Storting) declaró disuelta la unión personal con Suecia, vigente desde
    1814. Tras un referéndum y varias negociaciones, Suecia reconoció la independencia en octubre
    y el príncipe Carlos de Dinamarca fue coronado con el nombre de Haakon VII.
  en: >-
    The Norwegian parliament (Storting) declared the personal union with Sweden, in place since
    1814, dissolved. After a referendum and negotiations, Sweden recognised Norwegian independence
    in October and Prince Carl of Denmark became king as Haakon VII.
wikipedia:
  en: Dissolution of the union between Norway and Sweden
