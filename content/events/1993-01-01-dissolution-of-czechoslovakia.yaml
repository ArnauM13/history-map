date: 1993-01-01
category: independence
location: [14.421, 50.088]
countries: [315, 316, 317]
title:
  ca: Dissolució de Txecoslovàquia
  es: Disolución de Checoslovaquia
  en: Dissolution of Czechoslovakia
summary:
  ca: >-
    Txecoslovàquia es va dividir pacíficament en dos estats, Txèquia i Eslovàquia, en el que es
    coneix com el «divorci de vellut». La separació es va pactar entre els governs sense
    referèndum.
  es: >-
    Checoslovaquia se dividió pacíficamente en dos estados, Chequia y Eslovaquia, en lo que se
    conoce como el «divorcio de terciopelo». La separación se pactó entre los gobiernos sin
    referéndum.
  en: >-
    Czechoslovakia split peacefully into two states, Czechia and Slovakia, in what became known as
    the "Velvet Divorce". The separation was negotiated by the two governments without a
    referendum.
