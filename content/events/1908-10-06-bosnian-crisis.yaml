title:
  ca: Àustria-Hongria s'annexiona Bòsnia i Hercegovina
  es: Austria-Hungría se anexiona Bosnia y Herzegovina
  en: Austria-Hungary annexes Bosnia and Herzegovina
summary:
  ca: >-
    Àustria-Hongria, que ocupava Bòsnia i Hercegovina des de 1878, en va proclamar l'annexió.
    La decisió va indignar Sèrbia i Rússia i va tensar l'equilibri de poder als Balcans. El dia
    abans, Bulgària s'havia proclamat regne independent de l'Imperi otomà.
  es: >-
    Austria-Hungría, que ocupaba Bosnia y Herzegovina desde 1878, proclamó su anexión. La decisión
    indignó a Serbia y a Rusia y tensó el equilibrio de poder en los Balcanes. El día anterior,
    Bulgaria se había proclamado reino independiente del Imperio otomano.
  en: >-
    Austria-Hungary, which had occupied Bosnia and Herzegovina since 1878, proclaimed its
    annexation. The move outraged Serbia and Russia and strained the balance of power in the
    Balkans. The day before, Bulgaria had declared itself a kingdom independent of the Ottoman Empire.
