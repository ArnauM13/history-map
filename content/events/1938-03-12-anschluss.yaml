title:
  ca: Anschluss, annexió d'Àustria
  es: Anschluss, anexión de Austria
  en: Anschluss, annexation of Austria
summary:
  ca: >-
    Les tropes alemanyes van entrar a Àustria i l'endemà Hitler en va proclamar la unió amb el
    Reich, prohibida pels tractats de pau de 1919. França i el Regne Unit van protestar però no
    van actuar, cosa que va encoratjar noves reivindicacions territorials alemanyes.
  es: >-
    Las tropas alemanas entraron en Austria y al día siguiente Hitler proclamó su unión con el
    Reich, prohibida por los tratados de paz de 1919. Francia y el Reino Unido protestaron pero no
    actuaron, lo que animó nuevas reivindicaciones territoriales alemanas.
  en: >-
    German troops marched into Austria and the next day Hitler proclaimed its union with the
    Reich, which the 1919 peace treaties had forbidden. France and the United Kingdom protested but
    did not act, encouraging further German territorial demands.
