title:
  ca: Reunificació alemanya
  es: Reunificación alemana
  en: German reunification
summary:
  ca: >-
    La República Democràtica Alemanya es va integrar a la República Federal d'Alemanya, i Berlín
    va tornar a ser una sola ciutat. El Tractat Dos més Quatre va confirmar les fronteres
    definitives de l'Alemanya unificada.
  es: >-
    La República Democrática Alemana se integró en la República Federal de Alemania, y Berlín
    volvió a ser una sola ciudad. El Tratado Dos más Cuatro confirmó las fronteras definitivas de
    la Alemania unificada.
  en: >-
    The German Democratic Republic joined the Federal Republic of Germany and Berlin became a
    single city again. The Two Plus Four Treaty confirmed the final borders of unified Germany.
