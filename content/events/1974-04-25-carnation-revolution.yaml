title:
  ca: Revolució dels Clavells
  es: Revolución de los Claveles
  en: Carnation Revolution
summary:
  ca: >-
    Un cop d'estat d'oficials de l'exèrcit, recolzat per una gran mobilització popular, va
    enderrocar la dictadura de l'Estat Nou a Portugal gairebé sense violència. Va obrir el camí a
    la democràcia i a la independència de les colònies africanes.
  es: >-
    Un golpe de estado de oficiales del ejército, respaldado por una gran movilización popular,
    derrocó la dictadura del Estado Novo en Portugal casi sin violencia. Abrió el camino a la
    democracia y a la independencia de las colonias africanas.
  en: >-
    A coup by army officers, backed by massive popular support, toppled the Estado Novo
    dictatorship in Portugal with almost no bloodshed. It opened the way to democracy and to the
    independence of Portugal's African colonies.
