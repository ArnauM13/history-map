title:
  ca: Independència de Finlàndia
  es: Independencia de Finlandia
  en: Finnish independence
summary:
  ca: >-
    Aprofitant el col·lapse de l'Imperi Rus, el Parlament finlandès va declarar la independència
    del Gran Ducat de Finlàndia. La Rússia soviètica la va reconèixer el 31 de desembre, però el
    nou estat va patir una breu i cruenta guerra civil el 1918.
  es: >-
    Aprovechando el colapso del Imperio ruso, el Parlamento finlandés declaró la independencia del
    Gran Ducado de Finlandia. La Rusia soviética la reconoció el 31 de diciembre, pero el nuevo
    estado sufrió una breve y cruenta guerra civil en 1918.
  en: >-
    Taking advantage of the collapse of the Russian Empire, the Finnish parliament declared the
    Grand Duchy of Finland independent. Soviet Russia recognised it on 31 December, but the new
    state went through a short and bloody civil war in 1918.
