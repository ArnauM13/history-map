title:
  ca: Revolució d'Octubre
  es: Revolución de Octubre
  en: October Revolution
summary:
  ca: >-
    Els bolxevics, liderats per Lenin, van prendre el poder a Petrograd i van enderrocar el Govern
    Provisional sorgit de la revolució de febrer. Al calendari julià, encara vigent a Rússia, era
    el 25 d'octubre. El nou règim va signar la pau amb les Potències Centrals i el país va entrar
    en una guerra civil.
  es: >-
    Los bolcheviques, liderados por Lenin, tomaron el poder en Petrogrado y derrocaron al Gobierno
    Provisional surgido de la revolución de febrero. En el calendario juliano, aún vigente en
    Rusia, era el 25 de octubre. El nuevo régimen firmó la paz con las Potencias Centrales y el
    país entró en una guerra civil.
  en: >-
    The Bolsheviks, led by Lenin, seized power in Petrograd and overthrew the Provisional
    Government that had emerged from the February Revolution. In the Julian calendar, still used in
    Russia, it was 25 October. The new regime made peace with the Central Powers and the country
    slid into civil war.
