  en: Major enlargement of the European Union
summary:
  ca: >-
    Deu països es van incorporar a la Unió Europea: Xipre, Eslovàquia, Eslovènia, Estònia,
    Hongria, Letònia, Lituània, Malta, Polònia i Txèquia. Va ser l'ampliació més gran de la seva
    història i va simbolitzar el final de la divisió de la Guerra Freda.
  es: >-
    Diez países se incorporaron a la Unión Europea: Chipre, Chequia, Eslovaquia, Eslovenia,
    Estonia, Hungría, Letonia, Lituania, Malta y Polonia. Fue la mayor ampliación de su historia y
    simbolizó el final de la división de la Guerra Fría.
  en: >-
    Ten countries joined the European Union: Cyprus, Czechia, Estonia, Hungary, Latvia, Lithuania,
    Malta, Poland, Slovakia and Slovenia. It was the largest enlargement in its history and
    symbolised the end of the Cold War division.
