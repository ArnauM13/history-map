summary:
  ca: >-
    Rússia va llançar una invasió a gran escala d'Ucraïna des del nord, l'est i el sud. És el
    conflicte armat més gran a Europa des de la Segona Guerra Mundial i ha provocat milions de
    desplaçats.
  es: >-
    Rusia lanzó una invasión a gran escala de Ucrania desde el norte, el este y el sur. Es el
    mayor conflicto armado en Europa desde la Segunda Guerra Mundial y ha provocado millones de
    desplazados.
  en: >-
    Russia launched a full-scale invasion of Ukraine from the north, east and south. It is the
    largest armed conflict in Europe since the Second World War and has displaced millions of
    people.
