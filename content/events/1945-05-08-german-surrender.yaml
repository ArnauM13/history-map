title:
  ca: Capitulació d'Alemanya
  es: Capitulación de Alemania
  en: German surrender
summary:
  ca: >-
    Alemanya va signar la capitulació incondicional a Reims (7 de maig) i a Berlín (8 de maig),
    que va posar fi a la guerra a Europa. El país va quedar dividit en quatre zones d'ocupació i
    les seves fronteres orientals es van desplaçar fins a la línia Oder-Neisse.
  es: >-
    Alemania firmó la capitulación incondicional en Reims (7 de mayo) y en Berlín (8 de mayo), que
    puso fin a la guerra en Europa. El país quedó dividido en cuatro zonas de ocupación y sus
    fronteras orientales se desplazaron hasta la línea Óder-Neisse.
  en: >-
    Germany signed its unconditional surrender in Reims (7 May) and Berlin (8 May), ending the war
    in Europe. The country was split into four occupation zones and its eastern border was moved
    to the Oder–Neisse line.
