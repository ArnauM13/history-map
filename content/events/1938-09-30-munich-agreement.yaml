title:
  ca: Acords de Munic
  es: Acuerdos de Múnich
  en: Munich Agreement
summary:
  ca: >-
    Alemanya, el Regne Unit, França i Itàlia van acordar, sense la presència de Txecoslovàquia,
    la cessió dels Sudets a Alemanya. Va ser el punt culminant de la política d'apaivagament: sis
    mesos després, Hitler ocupava la resta de Bohèmia i Moràvia.
  es: >-
    Alemania, el Reino Unido, Francia e Italia acordaron, sin la presencia de Checoslovaquia, la
    cesión de los Sudetes a Alemania. Fue el punto culminante de la política de apaciguamiento:
    seis meses después, Hitler ocupaba el resto de Bohemia y Moravia.
  en: >-
    Germany, the United Kingdom, France and Italy agreed, without Czechoslovakia at the table, to
    hand the Sudetenland to Germany. It was the high point of appeasement: six months later Hitler
    occupied the rest of Bohemia and Moravia.
