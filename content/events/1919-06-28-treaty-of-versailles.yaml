title:
  ca: Tractat de Versalles
  es: Tratado de Versalles
  en: Treaty of Versailles
summary:
  ca: >-
    Signat a la Sala dels Miralls, el tractat va imposar a Alemanya la pèrdua d'Alsàcia-Lorena, de
    territoris a favor de Polònia i de totes les colònies, a més de fortes reparacions i
    limitacions militars. Juntament amb els tractats de Saint-Germain, Trianon, Neuilly i Sèvres va
    redibuixar el mapa d'Europa i de l'Orient Mitjà.
  es: >-
    Firmado en la Galería de los Espejos, el tratado impuso a Alemania la pérdida de
    Alsacia-Lorena, de territorios en favor de Polonia y de todas sus colonias, además de fuertes
    reparaciones y limitaciones militares. Junto con los tratados de Saint-Germain, Trianon,
    Neuilly y Sèvres redibujó el mapa de Europa y de Oriente Próximo.
  en: >-
    Signed in the Hall of Mirrors, the treaty stripped Germany of Alsace-Lorraine, of territory
    ceded to Poland and of all its colonies, and imposed heavy reparations and military limits.
    Together with the treaties of Saint-Germain, Trianon, Neuilly and Sèvres it redrew the map of
    Europe and the Middle East.
