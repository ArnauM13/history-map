title:
  ca: Creació de la Unió Soviètica
  es: Creación de la Unión Soviética
  en: Creation of the Soviet Union
summary:
  ca: >-
    Les repúbliques soviètiques de Rússia, Ucraïna, Bielorússia i Transcaucàsia van signar el
    tractat que creava la Unió de Repúbliques Socialistes Soviètiques (URSS), amb capital a Moscou.
    Seria l'estat més extens del món fins a la seva dissolució el 1991.
  es: >-
    Las repúblicas soviéticas de Rusia, Ucrania, Bielorrusia y Transcaucasia firmaron el tratado
    que creaba la Unión de Repúblicas Socialistas Soviéticas (URSS), con capital en Moscú. Sería el
    estado más extenso del mundo hasta su disolución en 1991.
  en: >-
    The Soviet republics of Russia, Ukraine, Byelorussia and Transcaucasia signed the treaty
    creating the Union of Soviet Socialist Republics (USSR), with Moscow as its capital. It would
    remain the largest state in the world until its dissolution in 1991.
