title:
  ca: Proclamació de l'Estat d'Israel
  es: Proclamación del Estado de Israel
  en: Israel declares independence
summary:
  ca: >-
    El dia que s'acabava el mandat britànic de Palestina, David Ben-Gurion va proclamar l'Estat
    d'Israel a Tel Aviv. El pla de partició de l'ONU del 1947 preveia un estat jueu i un d'àrab;
    l'àrab no es va crear.
  es: >-
    El día en que terminaba el mandato británico de Palestina, David Ben-Gurión proclamó el Estado
    de Israel en Tel Aviv. El plan de partición de la ONU de 1947 preveía un estado judío y uno
    árabe; el árabe no se creó.
  en: >-
    On the day the British Mandate for Palestine ended, David Ben-Gurion proclaimed the State of
    Israel in Tel Aviv. The 1947 UN partition plan had provided for a Jewish state and an Arab one;
    the Arab state was not created.
