title:
  ca: Proclamació de l'Estat de Palestina
  es: Proclamación del Estado de Palestina
  en: Palestine declares independence
summary:
  ca: >-
    El Consell Nacional Palestí, reunit a Alger, va proclamar l'Estat de Palestina, amb Jerusalem
    com a capital, sobre els territoris ocupats per Israel el 1967. Jordània havia renunciat a
    Cisjordània el 31 de juliol. El 2025, 157 dels 193 membres de l'ONU el reconeixien.
  es: >-
    El Consejo Nacional Palestino, reunido en Argel, proclamó el Estado de Palestina, con Jerusalén
    como capital, sobre los territorios ocupados por Israel en 1967. Jordania había renunciado a
    Cisjordania el 31 de julio. En 2025, 157 de los 193 miembros de la ONU lo reconocían.
  en: >-
    Meeting in Algiers, the Palestine National Council proclaimed the State of Palestine, with
    Jerusalem as its capital, on the territories occupied by Israel in 1967. Jordan had given up
    its claim to the West Bank on 31 July. By 2025, 157 of the 193 UN members recognised it.
