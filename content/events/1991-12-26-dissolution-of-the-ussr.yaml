title:
  ca: Dissolució de la Unió Soviètica
  es: Disolución de la Unión Soviética
  en: Dissolution of the Soviet Union
summary:
  ca: >-
    L'endemà de la dimissió de Mikhaïl Gorbatxov, el Soviet Suprem va reconèixer la dissolució de
    l'URSS. Les quinze repúbliques que la formaven, entre elles Ucraïna, Bielorússia i els estats
    bàltics, ja eren o esdevenien estats independents.
  es: >-
    Un día después de la dimisión de Mijaíl Gorbachov, el Sóviet Supremo reconoció la disolución
    de la URSS. Las quince repúblicas que la formaban, entre ellas Ucrania, Bielorrusia y los
    estados bálticos, ya eran o pasaban a ser estados independientes.
  en: >-
    The day after Mikhail Gorbachev resigned, the Supreme Soviet acknowledged the dissolution of
    the USSR. Its fifteen republics, including Ukraine, Belarus and the Baltic states, were already
    or were becoming independent states.
