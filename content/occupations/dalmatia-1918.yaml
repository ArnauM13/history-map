summary:
  ca: >-
    Itàlia va desembarcar a Zara el 4 de novembre del 1918 i va ocupar la Dalmàcia del nord fins a
    la línia del pacte de Londres, amb Šibenik, Knin i Drniš, que va governar l'almirall Millo. El
    tractat de Rapallo (1920) la va donar al Regne dels Serbis, Croats i Eslovens, tret de Zara, i
    Itàlia la va evacuar per fases: l'exèrcit va sortir de Šibenik el 12 de juny del 1921.
  es: >-
    Italia desembarcó en Zara el 4 de noviembre de 1918 y ocupó la Dalmacia del norte hasta la línea
    del pacto de Londres, con Šibenik, Knin y Drniš, que gobernó el almirante Millo. El tratado de
    Rapallo (1920) la dio al Reino de los Serbios, Croatas y Eslovenos, salvo Zara, e Italia la
    evacuó por fases: el ejército salió de Šibenik el 12 de junio de 1921.
  en: >-
    Italy landed at Zara on 4 November 1918 and occupied northern Dalmatia up to the line of the
    Treaty of London, with Šibenik, Knin and Drniš, which Admiral Millo governed. The Treaty of
    Rapallo (1920) gave it to the Kingdom of Serbs, Croats and Slovenes, except Zara, and Italy
    evacuated it in stages: the army left Šibenik on 12 June 1921.
