summary:
  ca: >-
    Itàlia va ocupar Krk i Rab el 26 de novembre del 1918, més enllà del que li donava el pacte de
    Londres. Rapallo les va deixar al Regne dels Serbis, Croats i Eslovens, i l'endemà hi van
    desembarcar els legionaris de D'Annunzio, que se'n van anar de Krk el 9 de gener del 1921.
    L'exèrcit italià va lliurar Rab el 23 d'abril i va sortir de Krk el 25.
  es: >-
    Italia ocupó Krk y Rab el 26 de noviembre de 1918, más allá de lo que le daba el pacto de
    Londres. Rapallo las dejó al Reino de los Serbios, Croatas y Eslovenos, y al día siguiente
    desembarcaron en ellas los legionarios de D'Annunzio, que dejaron Krk el 9 de enero de 1921. El
    ejército italiano entregó Rab el 23 de abril y salió de Krk el 25.
  en: >-
    Italy occupied Krk and Rab on 26 November 1918, beyond what the Treaty of London granted it.
    Rapallo left them to the Kingdom of Serbs, Croats and Slovenes, and the next day D'Annunzio's
    legionaries landed there; they left Krk on 9 January 1921. The Italian army handed over Rab on
    23 April and left Krk on the 25th.
