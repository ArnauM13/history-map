summary:
  ca: >-
    Alemanya va ocupar Dinamarca el 9 d'abril del 1940 en poques hores, i el govern danès va seguir
    governant sota control alemany fins que va dimitir, el 29 d'agost del 1943. Aquell octubre, la
    resistència va fer passar a Suècia gairebé tots els jueus del país. Les tropes alemanyes a
    Dinamarca van capitular el 5 de maig del 1945.
  es: >-
    Alemania ocupó Dinamarca el 9 de abril de 1940 en pocas horas, y el gobierno danés siguió
    gobernando bajo control alemán hasta que dimitió, el 29 de agosto de 1943. Ese octubre, la
    resistencia hizo pasar a Suecia a casi todos los judíos del país. Las tropas alemanas en
    Dinamarca capitularon el 5 de mayo de 1945.
  en: >-
    Germany occupied Denmark within a few hours on 9 April 1940, and the Danish government went on
    ruling under German control until it resigned on 29 August 1943. That October, the resistance
    got almost all of the country's Jews across to Sweden. The German troops in Denmark
    surrendered on 5 May 1945.
