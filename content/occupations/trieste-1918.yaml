summary:
  ca: >-
    Les tropes italianes van entrar a Trieste el 3 de novembre del 1918, el dia que es va signar
    l'armistici de Villa Giusti, i van ocupar Gorízia, la vall de l'Isonzo i Tarvisio. Àustria hi
    va renunciar a favor d'Itàlia pel tractat de Saint-Germain, el 10 de setembre del 1919.
  es: >-
    Las tropas italianas entraron en Trieste el 3 de noviembre de 1918, el día en que se firmó el
    armisticio de Villa Giusti, y ocuparon Gorizia, el valle del Isonzo y Tarvisio. Austria
    renunció a ellos en favor de Italia por el tratado de Saint-Germain, el 10 de septiembre de 1919.
  en: >-
    Italian troops entered Trieste on 3 November 1918, the day the Armistice of Villa Giusti was
    signed, and occupied Gorizia, the Isonzo valley and Tarvisio. Austria renounced them in favour
    of Italy by the Treaty of Saint-Germain on 10 September 1919.
