title:
  ca: Territoris annexionats del Fiumà i el Kupa
  es: Territorios anexionados del Fiumano y el Kupa
  en: Annexed Territories of Fiume and the Kupa
label:
  ca: Sušak, Krk i Rab
  es: Sušak, Krk y Rab
  en: Sušak, Krk and Rab
summary:
  ca: >-
    Pels Tractats de Roma del 18 de maig del 1941, Itàlia es va annexionar el que envoltava Fiume
    per l'est i pel nord —Sušak, a l'altra riba del Rječina, Kastav, Bakar, Fužine i Čabar— i les
    illes de Krk i Rab, i ho va afegir a la província de Fiume. Després de l'armistici italià del
    setembre del 1943 ho va governar Alemanya, dins del Litoral Adriàtic. L'exèrcit iugoslau va
    entrar a Fiume el 3 de maig del 1945.
  es: >-
    Por los Tratados de Roma del 18 de mayo de 1941, Italia se anexionó lo que rodeaba Fiume por el
    este y por el norte —Sušak, en la otra orilla del Rječina, Kastav, Bakar, Fužine y Čabar— y las
    islas de Krk y Rab, y lo añadió a la provincia de Fiume. Tras el armisticio italiano de
    septiembre de 1943 lo gobernó Alemania, dentro del Litoral Adriático. El ejército yugoslavo
    entró en Fiume el 3 de mayo de 1945.
  en: >-
    Under the Treaties of Rome of 18 May 1941, Italy annexed the land around Fiume to the east and
    north —Sušak, across the Rječina, Kastav, Bakar, Fužine and Čabar— and the islands of Krk and
    Rab, and added them to the Province of Fiume. After the Italian armistice of September 1943
    Germany ruled them as part of the Adriatic Littoral. The Yugoslav army entered Fiume on 3 May
    1945.
