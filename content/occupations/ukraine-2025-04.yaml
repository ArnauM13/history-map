summary:
  ca: >-
    El 2025 Rússia va continuar avançant per la província de Donetsk. A la línia de l'1 de
    juliol del 2025 ja tenia Velika Novosilka, Toretsk i Txassiv Iar, i s'acostava a Pokrovsk
    per l'est i pel sud.
  es: >-
    En 2025 Rusia siguió avanzando por la provincia de Donetsk. En la línea del 1 de julio de
    2025 ya tenía Velyka Novosilka, Toretsk y Chásiv Yar, y se acercaba a Pokrovsk por el este y
    por el sur.
  en: >-
    In 2025 Russia kept advancing through Donetsk Oblast. On the line of 1 July 2025 it already
    held Velyka Novosilka, Toretsk and Chasiv Yar, and was closing on Pokrovsk from the east and
    the south.
