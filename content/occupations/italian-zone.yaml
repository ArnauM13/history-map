summary:
  ca: >-
    Itàlia, que des del juny del 1940 ja ocupava Menton i una franja dels Alps, va ocupar la França
    a l'est del Roine l'11 de novembre del 1942. Les autoritats italianes s'hi van negar a lliurar
    els jueus que s'hi havien refugiat. Quan Itàlia va signar l'armistici, el setembre del 1943,
    l'ocupació la va prendre Alemanya.
  es: >-
    Italia, que desde junio de 1940 ya ocupaba Menton y una franja de los Alpes, ocupó la Francia
    al este del Ródano el 11 de noviembre de 1942. Las autoridades italianas se negaron a entregar
    a los judíos que se habían refugiado allí. Cuando Italia firmó el armisticio, en septiembre de
    1943, la ocupación pasó a Alemania.
  en: >-
    Italy, which had held Menton and a strip of the Alps since June 1940, occupied France east of
    the Rhône on 11 November 1942. The Italian authorities refused to hand over the Jews who had
    taken refuge there. When Italy signed the armistice in September 1943, Germany took over the
    occupation.
