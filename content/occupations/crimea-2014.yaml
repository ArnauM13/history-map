summary:
  ca: >-
    El 27 de febrer del 2014 soldats russos sense distintius van prendre el parlament de Crimea,
    i en poques setmanes, tota la península. Rússia se la va annexionar el 18 de març, després
    d'un referèndum que l'Assemblea General de l'ONU no va reconèixer (resolució 68/262). Per a
    Ucraïna i la gran majoria d'estats, és territori ucraïnès ocupat.
  es: >-
    El 27 de febrero de 2014 soldados rusos sin distintivos tomaron el parlamento de Crimea y,
    en pocas semanas, toda la península. Rusia se la anexionó el 18 de marzo, después de un
    referéndum que la Asamblea General de la ONU no reconoció (resolución 68/262). Para Ucrania
    y la gran mayoría de estados, es territorio ucraniano ocupado.
  en: >-
    On 27 February 2014 Russian soldiers without insignia seized the Crimean parliament and,
    within weeks, the whole peninsula. Russia annexed it on 18 March, after a referendum the UN
    General Assembly did not recognise (Resolution 68/262). For Ukraine and the great majority
    of states, it is occupied Ukrainian territory.
