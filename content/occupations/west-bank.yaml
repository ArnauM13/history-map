title:
  ca: Cisjordània ocupada
  es: Cisjordania ocupada
  en: Occupied West Bank
summary:
  ca: >-
    Israel va prendre Cisjordània i Jerusalem Est a Jordània el 7 de juny del 1967. El 1980 es va
    annexionar Jerusalem Est, una annexió que el Consell de Seguretat de l'ONU va declarar nul·la
    (resolució 478). Pels acords d'Oslo, des del 1995 l'Autoritat Nacional Palestina governa les
    ciutats (l'àrea A) i, amb la seguretat en mans d'Israel, molts pobles (l'àrea B); Israel
    controla sol el 62 % del territori, l'àrea C, on hi ha els assentaments. El Tribunal Internacional de Justícia va declarar il·legal l'ocupació el 2024.
  es: >-
    Israel tomó Cisjordania y Jerusalén Este a Jordania el 7 de junio de 1967. En 1980 se anexionó
    Jerusalén Este, una anexión que el Consejo de Seguridad de la ONU declaró nula (resolución
    478). Por los acuerdos de Oslo, desde 1995 la Autoridad Nacional Palestina gobierna las
    ciudades (el área A) y, con la seguridad en manos de Israel, muchos pueblos (el área B); Israel
    controla en solitario el 62 % del territorio, el área C, donde están los asentamientos. La Corte Internacional de Justicia declaró ilegal la ocupación en 2024.
  en: >-
    Israel took the West Bank and East Jerusalem from Jordan on 7 June 1967. In 1980 it annexed East
    Jerusalem, an annexation the UN Security Council declared null and void (Resolution 478). Under
    the Oslo Accords, since 1995 the Palestinian National Authority has governed the towns (Area A)
    and, with Israel in charge of security, many villages (Area B); Israel alone controls 62% of the
    territory, Area C, where the settlements are.
    The International Court of Justice declared the occupation unlawful in 2024.
