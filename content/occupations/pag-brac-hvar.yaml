title:
  ca: Pag, Brač i Hvar
  es: Pag, Brač y Hvar
  en: Pag, Brač and Hvar
summary:
  ca: >-
    Els Tractats de Roma del maig del 1941 van deixar aquestes tres illes a l'Estat Independent de
    Croàcia, quan Itàlia es quedava gairebé totes les altres. El 7 de setembre del 1941, però, Itàlia
    va prendre el govern militar i civil de tota la costa croata, i les illes van quedar ocupades
    fins a l'armistici italià del setembre del 1943. Després van tornar a l'Estat Independent de
    Croàcia.
  es: >-
    Los Tratados de Roma de mayo de 1941 dejaron estas tres islas al Estado Independiente de
    Croacia, cuando Italia se quedaba casi todas las demás. El 7 de septiembre de 1941, sin embargo,
    Italia tomó el gobierno militar y civil de toda la costa croata, y las islas quedaron ocupadas
    hasta el armisticio italiano de septiembre de 1943. Después volvieron al Estado Independiente de
    Croacia.
  en: >-
    The Treaties of Rome of May 1941 left these three islands to the Independent State of Croatia,
    while Italy took almost all the others. On 7 September 1941, however, Italy took over the
    military and civil administration of the whole Croatian coast, and the islands stayed occupied
    until the Italian armistice of September 1943. They then went back to the Independent State of
    Croatia.
