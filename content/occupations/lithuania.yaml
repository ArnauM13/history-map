  en: Occupied Lithuania
summary:
  ca: >-
    Alemanya va prendre Kaunas i Vílnius el 24 de juny del 1941, dos dies després d'envair la Unió
    Soviètica, que s'havia annexionat Lituània l'any abans. Hi van assassinar gairebé tots els jueus
    del país, uns 200.000. L'Exèrcit Roig va alliberar Vílnius el 13 de juliol del 1944, i Kaunas,
    l'1 d'agost.
  es: >-
    Alemania tomó Kaunas y Vilna el 24 de junio de 1941, dos días después de invadir la Unión
    Soviética, que se había anexionado Lituania el año anterior. Allí se asesinó a casi todos los
    judíos del país, unos 200.000. El Ejército Rojo liberó Vilna el 13 de julio de 1944, y Kaunas,
    el 1 de agosto.
  en: >-
    Germany took Kaunas and Vilnius on 24 June 1941, two days after invading the Soviet Union, which
    had annexed Lithuania the year before. Nearly all the country's Jews, some 200,000, were
    murdered there. The Red Army liberated Vilnius on 13 July 1944, and Kaunas on 1 August.
