summary:
  ca: >-
    Retirat del nord, l'exèrcit rus es va concentrar al Donbàs i al sud. Mariúpol va caure el 20
    de maig, després de gairebé tres mesos de setge, i Sievierodonetsk, el 25 de juny. La línia
    és la de l'1 de juny del 2022.
  es: >-
    Tras retirarse del norte, el ejército ruso se concentró en el Donbás y en el sur. Mariúpol
    cayó el 20 de mayo, después de casi tres meses de asedio, y Severodonetsk, el 25 de junio.
    La línea es la del 1 de junio de 2022.
  en: >-
    Having withdrawn from the north, the Russian army concentrated on Donbas and the south.
    Mariupol fell on 20 May, after almost three months of siege, and Sievierodonetsk on 25 June.
    The line is that of 1 June 2022.
