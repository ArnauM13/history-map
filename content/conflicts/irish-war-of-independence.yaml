summary:
  ca: >-
    L'Exèrcit Republicà Irlandès (IRA) va lluitar contra les forces britàniques després que els
    diputats independentistes proclamessin una república. El Tractat Angloirlandès de 1921 va
    crear l'Estat Lliure d'Irlanda, mentre que Irlanda del Nord va romandre al Regne Unit.
  es: >-
    El Ejército Republicano Irlandés (IRA) luchó contra las fuerzas británicas después de que los
    diputados independentistas proclamaran una república. El Tratado Anglo-Irlandés de 1921 creó
    el Estado Libre Irlandés, mientras que Irlanda del Norte permaneció en el Reino Unido.
  en: >-
    The Irish Republican Army (IRA) fought British forces after pro-independence MPs proclaimed a
    republic. The 1921 Anglo-Irish Treaty created the Irish Free State, while Northern Ireland
    remained in the United Kingdom.
