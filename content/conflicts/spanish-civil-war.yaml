summary:
  ca: >-
    Un cop d'estat militar contra la Segona República va derivar en una guerra civil entre el bàndol
    republicà i el sublevat, liderat per Francisco Franco. Amb el suport de l'Alemanya nazi i la
    Itàlia feixista, els sublevats van guanyar i van instaurar una dictadura que va durar fins al 1975.
  es: >-
    Un golpe de estado militar contra la Segunda República derivó en una guerra civil entre el
    bando republicano y el sublevado, liderado por Francisco Franco. Con el apoyo de la Alemania
    nazi y la Italia fascista, los sublevados ganaron e instauraron una dictadura que duró hasta 1975.
  en: >-
    A military coup against the Second Republic turned into a civil war between the Republicans
    and the rebel Nationalists led by Francisco Franco. Backed by Nazi Germany and Fascist Italy,
    the Nationalists won and established a dictatorship that lasted until 1975.
