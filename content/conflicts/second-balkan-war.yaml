summary:
  ca: >-
    Insatisfeta amb el repartiment de Macedònia, Bulgària va atacar els seus antics aliats, Sèrbia
    i Grècia, als quals es van afegir Romania i l'Imperi otomà. Derrotada, Bulgària va perdre
    territoris pel Tractat de Bucarest.
  es: >-
    Insatisfecha con el reparto de Macedonia, Bulgaria atacó a sus antiguos aliados, Serbia y
    Grecia, a los que se sumaron Rumania y el Imperio otomano. Derrotada, Bulgaria perdió
    territorios por el Tratado de Bucarest.
  en: >-
    Unhappy with the partition of Macedonia, Bulgaria attacked its former allies Serbia and Greece,
    who were joined by Romania and the Ottoman Empire. Defeated, Bulgaria lost territory under the
    Treaty of Bucharest.
