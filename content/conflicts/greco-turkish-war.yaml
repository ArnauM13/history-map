title:
  ca: Guerra grecoturca
  es: Guerra greco-turca
  en: Greco-Turkish War
summary:
  ca: >-
    Grècia va desembarcar a Esmirna i va avançar per l'Anatòlia occidental, però va ser derrotada
    pel moviment nacional turc de Mustafa Kemal. El Tractat de Lausana (1923) va fixar les
    fronteres de la nova Turquia i va imposar un intercanvi massiu de població.
  es: >-
    Grecia desembarcó en Esmirna y avanzó por Anatolia occidental, pero fue derrotada por el
    movimiento nacional turco de Mustafa Kemal. El Tratado de Lausana (1923) fijó las fronteras de
    la nueva Turquía e impuso un intercambio masivo de población.
  en: >-
    Greece landed in Smyrna and advanced across western Anatolia, but was defeated by Mustafa
    Kemal's Turkish national movement. The Treaty of Lausanne (1923) fixed the borders of the new
    Turkey and imposed a large population exchange.
