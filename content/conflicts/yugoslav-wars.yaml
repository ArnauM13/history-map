summary:
  ca: >-
    La desintegració de Iugoslàvia va provocar una sèrie de guerres a Eslovènia, Croàcia, Bòsnia i
    Hercegovina, Kosovo i Macedònia. Van ser els conflictes més mortífers a Europa des de 1945,
    amb massacres com la de Srebrenica, qualificada de genocidi per tribunals internacionals.
  es: >-
    La desintegración de Yugoslavia provocó una serie de guerras en Eslovenia, Croacia, Bosnia y
    Herzegovina, Kosovo y Macedonia. Fueron los conflictos más mortíferos en Europa desde 1945, con
    masacres como la de Srebrenica, calificada de genocidio por tribunales internacionales.
  en: >-
    The break-up of Yugoslavia led to a series of wars in Slovenia, Croatia, Bosnia and
    Herzegovina, Kosovo and Macedonia. They were the deadliest conflicts in Europe since 1945,
    including massacres such as Srebrenica, ruled a genocide by international courts.
