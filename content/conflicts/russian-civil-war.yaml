summary:
  ca: >-
    L'Exèrcit Roig bolxevic es va enfrontar als exèrcits blancs, a moviments nacionals i a
    intervencions estrangeres. La victòria bolxevic va consolidar el règim soviètic, mentre que
    Finlàndia, els estats bàltics i Polònia van mantenir la seva independència.
  es: >-
    El Ejército Rojo bolchevique se enfrentó a los ejércitos blancos, a movimientos nacionales y a
    intervenciones extranjeras. La victoria bolchevique consolidó el régimen soviético, mientras
    que Finlandia, los estados bálticos y Polonia mantuvieron su independencia.
  en: >-
    The Bolshevik Red Army fought the White armies, national movements and foreign interventions.
    The Bolshevik victory consolidated the Soviet regime, while Finland, the Baltic states and
    Poland kept their independence.
