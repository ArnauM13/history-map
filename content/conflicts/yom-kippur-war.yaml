title:
  ca: Guerra del Yom Kippur
  es: Guerra del Yom Kipur
  en: Yom Kippur War
summary:
  ca: >-
    Egipte i Síria van atacar Israel el dia del Yom Kippur per recuperar el Sinaí i el Golan.
    Egipte va travessar el canal de Suez, però Israel va contraatacar als dos fronts fins a l'alto
    el foc. La guerra va obrir les negociacions que van acabar amb el tractat de pau entre Egipte i
    Israel del 1979.
  es: >-
    Egipto y Siria atacaron Israel el día del Yom Kipur para recuperar el Sinaí y el Golán. Egipto
    cruzó el canal de Suez, pero Israel contraatacó en los dos frentes hasta el alto el fuego. La
    guerra abrió las negociaciones que acabaron con el tratado de paz entre Egipto e Israel de 1979.
  en: >-
    Egypt and Syria attacked Israel on Yom Kippur to retake the Sinai and the Golan. Egypt crossed
    the Suez Canal, but Israel counter-attacked on both fronts until the ceasefire. The war opened
    the talks that led to the 1979 Egypt–Israel peace treaty.
