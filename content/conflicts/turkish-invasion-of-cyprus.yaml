title:
  ca: Invasió turca de Xipre
  es: Invasión turca de Chipre
  en: Turkish invasion of Cyprus
summary:
  ca: >-
    Després d'un cop d'estat a Xipre impulsat per la junta militar grega, Turquia va envair el
    nord de l'illa. Des de llavors l'illa està dividida per una línia verda vigilada per l'ONU.
  es: >-
    Tras un golpe de estado en Chipre impulsado por la junta militar griega, Turquía invadió el
    norte de la isla. Desde entonces la isla está dividida por una línea verde vigilada por la ONU.
  en: >-
    After a coup in Cyprus backed by the Greek military junta, Turkey invaded the north of the
    island. Since then the island has been divided by a UN-patrolled Green Line.
