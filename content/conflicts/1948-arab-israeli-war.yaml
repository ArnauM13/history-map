title:
  ca: Guerra araboisraeliana del 1948
  es: Guerra árabe-israelí de 1948
  en: 1948 Arab–Israeli War
summary:
  ca: >-
    L'endemà de la proclamació d'Israel, els exèrcits d'Egipte, Transjordània, Síria, l'Iraq i el
    Líban van entrar a l'antic mandat de Palestina. Els
    armisticis del 1949 van fixar la Línia Verda: Israel es va quedar el 78 % de l'antic mandat,
    Jordània Cisjordània i Egipte Gaza. Uns 700.000 palestins van fugir o van ser expulsats (la
    Nakba).
  es: >-
    Al día siguiente de la proclamación de Israel, los ejércitos de Egipto, Transjordania, Siria,
    Irak y el Líbano entraron en el antiguo mandato de Palestina. Los armisticios de 1949 fijaron la Línea Verde: Israel se quedó el 78 % del antiguo mandato,
    Jordania Cisjordania y Egipto Gaza. Unos 700.000 palestinos huyeron o fueron expulsados (la
    Nakba).
  en: >-
    The day after Israel was proclaimed, the armies of Egypt, Transjordan, Syria, Iraq and Lebanon
    entered the former Mandate of Palestine. The
    1949 armistices set the Green Line: Israel kept 78% of the former mandate, Jordan the West Bank
    and Egypt Gaza. Some 700,000 Palestinians fled or were expelled (the Nakba).
