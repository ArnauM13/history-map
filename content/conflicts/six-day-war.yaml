title:
  ca: Guerra dels Sis Dies
  es: Guerra de los Seis Días
  en: Six-Day War
summary:
  ca: >-
    Després que Egipte tanqués l'estret de Tiran als vaixells israelians, Israel va atacar
    l'aviació egípcia el 5 de juny i, en sis dies, va prendre el Sinaí i Gaza a Egipte, Cisjordània i
    Jerusalem Est a Jordània, i el Golan a Síria. La resolució 242 de l'ONU li va demanar que es
    retirés dels territoris ocupats, a canvi de la pau i del reconeixement.
  es: >-
    Después de que Egipto cerrara el estrecho de Tirán a los barcos israelíes, Israel atacó la
    aviación egipcia el 5 de junio y, en seis días, tomó el Sinaí y Gaza a Egipto, Cisjordania y Jerusalén Este
    a Jordania, y el Golán a Siria. La resolución 242 de la ONU le pidió que se retirara de los
    territorios ocupados, a cambio de la paz y del reconocimiento.
  en: >-
    After Egypt closed the Straits of Tiran to Israeli shipping, Israel struck the Egyptian air
    force on 5 June and, in six days, took the Sinai and Gaza from Egypt, the West Bank and East
    Jerusalem from Jordan, and the Golan from Syria. UN Resolution 242 called on it to withdraw from
    the occupied territories in exchange for peace and recognition.
wikipedia:
