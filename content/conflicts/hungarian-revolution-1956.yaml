title:
  ca: Revolució hongaresa de 1956
  es: Revolución húngara de 1956
  en: Hungarian Revolution of 1956
summary:
  ca: >-
    Una protesta estudiantil a Budapest es va convertir en una revolta nacional contra el règim
    comunista i el domini soviètic. El govern d'Imre Nagy va anunciar la sortida del Pacte de
    Varsòvia, però l'exèrcit soviètic va esclafar la revolució.
  es: >-
    Una protesta estudiantil en Budapest se convirtió en una revuelta nacional contra el régimen
    comunista y el dominio soviético. El gobierno de Imre Nagy anunció la salida del Pacto de
    Varsovia, pero el ejército soviético aplastó la revolución.
  en: >-
    A student protest in Budapest grew into a nationwide revolt against the communist regime and
    Soviet domination. Imre Nagy's government announced Hungary's withdrawal from the Warsaw Pact,
    but the Soviet army crushed the revolution.
