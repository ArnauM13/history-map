summary:
  ca: >-
    El govern grec, amb suport britànic i després nord-americà, es va enfrontar a l'exèrcit
    dirigit pels comunistes. Va ser un dels primers conflictes de la Guerra Freda i va acabar amb
    la derrota comunista.
  es: >-
    El gobierno griego, con apoyo británico y después estadounidense, se enfrentó al ejército
    dirigido por los comunistas. Fue uno de los primeros conflictos de la Guerra Fría y terminó con
    la derrota comunista.
  en: >-
    The Greek government, backed first by Britain and then by the United States, fought the
    communist-led Democratic Army. It was one of the first conflicts of the Cold War and ended in
    communist defeat.
