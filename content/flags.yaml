# National flags over time.
#
# `catalogue` maps a short id to a file on Wikimedia Commons. `npm run data:flags` downloads each
# file to public/flags/<id>.svg and records its licence in public/flags/credits.json (the "Flags"
# GitHub workflow runs it automatically when this file changes).
#
# `states` lists, for each Gleditsch & Ward code (see countries.yaml), the flags it used in
# chronological order. `until` is the last day (inclusive) a flag was in use; the last entry has
# no `until`. `flag` is a catalogue id, or `null` when the state had no flag of its own (e.g.
# Germany under Allied occupation). An entry without `flag` means "not documented yet" — used for
# periods as a colony, protectorate or mandate.
#
# Dates are those of official adoption, or of first use when that was earlier. Corrections with
# sources are very welcome (see CONTRIBUTING.md).

