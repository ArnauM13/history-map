# Les banderes de cada estat al llarg del temps.
#
# `catalogue` dona a cada bandera un identificador curt i el nom del fitxer a Wikimedia Commons.
# `npm run data:flags` en baixa una còpia en PNG a public/flags/<id>.png i n'apunta la llicència a
# public/flags/credits.json. No cal fer-ho a mà: el workflow «Flags» ho fa sol quan aquest fitxer
# canvia a GitHub.
#
# `about` explica una bandera: què vol dir i per què va arribar. Dues o tres frases, no més; el
# detall és a la Viquipèdia.
#
# `states` diu, per a cada codi de Gleditsch i Ward (vegeu countries.yaml), quines banderes va fer
# servir i fins quan. `until` és l'últim dia d'una bandera; l'última no en porta. `flag: null` vol
# dir que l'estat no en tenia de pròpia (l'Alemanya ocupada), i una entrada sense `flag`, que encara
# no està documentada (els anys com a colònia, protectorat o mandat).
#
# `sources` diu d'on surten les dates de cada estat: articles de la Viquipèdia anglesa sobre les
# seves banderes (els títols en català i castellà els treu `npm run data:sources`).
#
# Les dates són les de l'adopció oficial, o la del primer ús si va ser abans. Si en saps una de més
# bona, amb la font, endavant (CONTRIBUTING.md).

