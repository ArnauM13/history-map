about:
  de-1867:
    ca: >-
      El negre i el blanc de Prússia amb el vermell de les ciutats hanseàtiques. Va ser la bandera
      de la Confederació d'Alemanya del Nord i, des del 1871, de l'Imperi alemany.
    es: >-
      El negro y el blanco de Prusia con el rojo de las ciudades hanseáticas. Fue la bandera de la
      Confederación de Alemania del Norte y, desde 1871, del Imperio alemán.
    en: >-
      The black and white of Prussia with the red of the Hanseatic cities. It was the flag of the
      North German Confederation and, from 1871, of the German Empire.
  de-1919:
    ca: >-
      El negre, vermell i or de les revolucions liberals del 1848, que la República de Weimar va
      recuperar com a símbol democràtic. Els nazis la van abolir el 1933.
    es: >-
      El negro, rojo y oro de las revoluciones liberales de 1848, que la República de Weimar
      recuperó como símbolo democrático. Los nazis la abolieron en 1933.
    en: >-
      The black, red and gold of the liberal revolutions of 1848, revived by the Weimar Republic as
      a democratic symbol. The Nazis abolished it in 1933.
  de-1933:
    ca: >-
      Hitler va tornar als colors de l'Imperi el març del 1933, i durant dos anys van conviure amb
      la bandera del partit nazi.
    es: >-
      Hitler volvió a los colores del Imperio en marzo de 1933, y durante dos años convivieron con
      la bandera del partido nazi.
    en: >-
      Hitler brought back the imperial colours in March 1933, and for two years they flew alongside
      the Nazi party flag.
  de-1935:
    ca: >-
      La bandera del partit nazi va passar a ser l'única bandera nacional amb les lleis de Nuremberg,
      el setembre del 1935. Avui, a Alemanya i a Àustria només es pot mostrar en contextos
      històrics i educatius.
    es: >-
      La bandera del partido nazi pasó a ser la única bandera nacional con las leyes de Núremberg,
      en septiembre de 1935. Hoy, en Alemania y Austria solo puede mostrarse en contextos
      históricos y educativos.
    en: >-
      The Nazi party flag became the sole national flag with the Nuremberg Laws in September 1935.
      Today Germany and Austria only allow it to be shown in historical and educational contexts.
  de:
    ca: >-
      Els colors del 1848 i de Weimar, adoptats per la República Federal el 1949 i, des del 1990, per
      tota l'Alemanya reunificada.
    es: >-
      Los colores de 1848 y de Weimar, adoptados por la República Federal en 1949 y, desde 1990, por
      toda la Alemania reunificada.
    en: >-
      The colours of 1848 and of Weimar, adopted by the Federal Republic in 1949 and, since 1990, by
      the whole of reunified Germany.
  dd:
    ca: >-
      Fins al 1959 la RDA va fer servir la mateixa bandera que l'RFA. Llavors hi va afegir el
      martell, el compàs i les espigues: els obrers, els intel·lectuals i els pagesos.
    es: >-
      Hasta 1959 la RDA usó la misma bandera que la RFA. Entonces le añadió el martillo, el compás y
      las espigas: los obreros, los intelectuales y los campesinos.
    en: >-
      Until 1959 East Germany used the same flag as West Germany. It then added the hammer, the
      compass and the ring of rye: workers, intellectuals and farmers.
  es-1785:
    ca: >-
      Carles III va triar el vermell i el groc el 1785 perquè els vaixells de guerra es distingissin
      bé al mar. Amb el temps va passar a ser la bandera de l'Estat.
    es: >-
      Carlos III eligió el rojo y el amarillo en 1785 para que los buques de guerra se distinguieran
      bien en el mar. Con el tiempo pasó a ser la bandera del Estado.
    en: >-
      Charles III chose red and yellow in 1785 so that warships could be told apart at sea. In time
      it became the flag of the state.
  es-1931:
    ca: >-
      La Segona República va canviar la franja vermella de baix per una de morada, el color que
      s'atribuïa a Castella, i va posar una corona mural a l'escut en lloc de la reial.
    es: >-
      La Segunda República cambió la franja roja de abajo por una morada, el color que se atribuía a
      Castilla, y puso una corona mural en el escudo en lugar de la real.
    en: >-
      The Second Republic replaced the lower red stripe with a purple one, the colour then linked to
      Castile, and swapped the royal crown on the arms for a mural crown.
  es-1938:
    ca: >-
      La bandera del bàndol franquista, amb l'àguila de Sant Joan a l'escut. Després de la guerra va
      ser la de tot l'Estat.
    es: >-
      La bandera del bando franquista, con el águila de San Juan en el escudo. Después de la guerra
      fue la de todo el Estado.
    en: >-
      The flag of Franco's side, with the eagle of Saint John on the arms. After the war it became
      the flag of the whole state.
  es:
    ca: >-
      L'escut del 1981: els regnes de Castella, Lleó, Aragó, Navarra i Granada, les columnes
      d'Hèrcules i la corona reial. Va substituir l'àguila que encara es feia servir a la Transició.
    es: >-
      El escudo de 1981: los reinos de Castilla, León, Aragón, Navarra y Granada, las columnas de
      Hércules y la corona real. Sustituyó al águila que todavía se usaba en la Transición.
    en: >-
      The 1981 coat of arms: the kingdoms of Castile, León, Aragon, Navarre and Granada, the Pillars
      of Hercules and the royal crown. It replaced the eagle still used during the Transition.
  pt:
    ca: >-
      La República del 1910 va deixar el blau i blanc de la monarquia pel verd i vermell del partit
      republicà, amb l'esfera armil·lar dels navegants portuguesos.
    es: >-
      La República de 1910 dejó el azul y blanco de la monarquía por el verde y rojo del partido
      republicano, con la esfera armilar de los navegantes portugueses.
    en: >-
      The Republic of 1910 dropped the monarchy's blue and white for the republican party's green
      and red, with the armillary sphere of the Portuguese navigators.
  it:
    ca: >-
      La República del 1946 va treure l'escut de la casa de Savoia de la tricolor que Itàlia feia
      servir des del Risorgimento.
    es: >-
      La República de 1946 quitó el escudo de la casa de Saboya de la tricolor que Italia usaba desde
      el Risorgimento.
    en: >-
      The Republic of 1946 removed the arms of the House of Savoy from the tricolour Italy had used
      since the Risorgimento.
  ru:
    ca: >-
      Blanc, blau i vermell: la bandera de la Rússia imperial, recuperada el 1991 quan va caure la
      Unió Soviètica.
    es: >-
      Blanco, azul y rojo: la bandera de la Rusia imperial, recuperada en 1991 cuando cayó la Unión
      Soviética.
    en: >-
      White, blue and red: the flag of imperial Russia, brought back in 1991 when the Soviet Union
      fell.
  ru-1918:
    ca: >-
      La primera bandera de la Rússia soviètica: vermella, el color de la revolució, amb les
      inicials de la república en lletres daurades.
    es: >-
      La primera bandera de la Rusia soviética: roja, el color de la revolución, con las iniciales de
      la república en letras doradas.
    en: >-
      The first flag of Soviet Russia: red, the colour of the revolution, with the republic's
      initials in gold.
  su-1923:
    ca: >-
      La falç i el martell —els pagesos i els obrers— i l'estrella del partit, sobre el vermell de la
      revolució. El 1955 se'n van retocar les proporcions.
    es: >-
      La hoz y el martillo —los campesinos y los obreros— y la estrella del partido, sobre el rojo de
      la revolución. En 1955 se retocaron sus proporciones.
    en: >-
      The hammer and sickle —workers and peasants— and the party's star, on the red of the
      revolution. Its proportions were adjusted in 1955.
  hu-1949:
    ca: >-
      L'escut d'estil soviètic del règim de Rákosi. El 1956 els revolucionaris el van retallar de les
      banderes, i el forat es va convertir en el símbol de la revolució.
    es: >-
      El escudo de estilo soviético del régimen de Rákosi. En 1956 los revolucionarios lo
      recortaron de las banderas, y el agujero se convirtió en el símbolo de la revolución.
    en: >-
      The Soviet-style emblem of Rákosi's regime. In 1956 revolutionaries cut it out of their flags,
      and the hole became the symbol of the uprising.
  ro-1965:
    ca: >-
      L'escut de la República Socialista. El desembre del 1989 els manifestants el van retallar de
      les banderes, com els hongaresos el 1956.
    es: >-
      El escudo de la República Socialista. En diciembre de 1989 los manifestantes lo recortaron de
      las banderas, como los húngaros en 1956.
    en: >-
      The arms of the Socialist Republic. In December 1989 protesters cut them out of their flags,
      as Hungarians had done in 1956.
  yu-1946:
    ca: >-
      La Iugoslàvia de Tito va afegir una estrella vermella a la tricolor eslava del regne.
    es: >-
      La Yugoslavia de Tito añadió una estrella roja a la tricolor eslava del reino.
    en: >-
      Tito's Yugoslavia added a red star to the kingdom's Slavic tricolour.
  by-1991:
    ca: >-
      El blanc, vermell i blanc de la República Popular Bielorussa del 1918, recuperat amb la
      independència. El 1995, després d'un referèndum, es va tornar a una versió de la bandera
      soviètica.
    es: >-
      El blanco, rojo y blanco de la República Popular Bielorrusa de 1918, recuperado con la
      independencia. En 1995, tras un referéndum, se volvió a una versión de la bandera soviética.
    en: >-
      The white-red-white of the 1918 Belarusian People's Republic, revived at independence. In
      1995, after a referendum, it was replaced by a version of the Soviet-era flag.
  mk-1992:
    ca: >-
      El sol de Vergina, que Grècia considerava un símbol propi. El 1995 Macedònia el va canviar per
      un sol de vuit raigs.
    es: >-
      El sol de Vergina, que Grecia consideraba un símbolo propio. En 1995 Macedonia lo cambió por
      un sol de ocho rayos.
    en: >-
      The Vergina Sun, which Greece regarded as its own symbol. In 1995 Macedonia replaced it with
      an eight-rayed sun.
  gr-1822:
    ca: >-
      La creu blanca sobre blau va ser la bandera de Grècia a terra fins al 1978. La de les franges,
      que avui és l'única, era la del mar.
    es: >-
      La cruz blanca sobre azul fue la bandera de Grecia en tierra hasta 1978. La de las franjas,
      que hoy es la única, era la del mar.
    en: >-
      The white cross on blue was Greece's flag on land until 1978. The striped one, today the only
      one, was the flag used at sea.
  ge:
    ca: >-
      La bandera de les cinc creus, d'origen medieval, adoptada el 2004 després de la Revolució de
      les Roses.
    es: >-
      La bandera de las cinco cruces, de origen medieval, adoptada en 2004 tras la Revolución de las
      Rosas.
    en: >-
      The five-cross flag, of medieval origin, adopted in 2004 after the Rose Revolution.
  ie:
    ca: >-
      El verd de la tradició gaèlica, el taronja dels protestants i el blanc de la pau entre tots
      dos.
    es: >-
      El verde de la tradición gaélica, el naranja de los protestantes y el blanco de la paz entre
      ambos.
    en: >-
      The green of the Gaelic tradition, the orange of the Protestants and the white of peace
      between them.
  ly-1977:
    ca: >-
      Gaddafi va adoptar una bandera tota verda, el color de la seva «revolució verda». Ha estat
      l'única bandera nacional d'un sol color i sense cap dibuix.
    es: >-
      Gadafi adoptó una bandera toda verde, el color de su «revolución verde». Ha sido la única
      bandera nacional de un solo color y sin ningún dibujo.
    en: >-
      Gaddafi adopted an all-green flag, the colour of his "green revolution". It is the only
      national flag ever to be a single colour with no design.
  at-hu:
    ca: >-
      Àustria-Hongria no tenia una bandera comuna oficial. Aquesta, amb els colors i els escuts de les
      dues meitats de la monarquia, era la de la marina mercant.
    es: >-
      Austria-Hungría no tenía una bandera común oficial. Esta, con los colores y los escudos de las
      dos mitades de la monarquía, era la de la marina mercante.
    en: >-
      Austria-Hungary had no official common flag. This one, with the colours and arms of both
      halves of the monarchy, was its merchant ensign.
  ir-1907:
    ca: >-
      El verd, el blanc i el vermell amb el lleó i el sol, que s'havia convertit en el símbol del
      país amb la dinastia qajar. La constitució del 1907 la va fer oficial, i va durar, amb
      retocs, fins a la Revolució Islàmica.
    es: >-
      El verde, el blanco y el rojo con el león y el sol, que se había convertido en el símbolo del
      país con la dinastía Kayar. La constitución de 1907 la hizo oficial, y duró, con retoques,
      hasta la Revolución islámica.
    en: >-
      Green, white and red with the Lion and Sun, which had become the country's symbol under the
      Qajar dynasty. The 1907 constitution made it official, and with some retouching it lasted
      until the Islamic Revolution.
  uar:
    ca: >-
      Les franges de la bandera de la revolució egípcia del 1952 amb dues estrelles verdes, una per
      Egipte i una per Síria, quan es van unir en la República Àrab Unida. Egipte la va mantenir
      fins al 1972, i Síria la va recuperar del 1980 al 2024.
    es: >-
      Las franjas de la bandera de la revolución egipcia de 1952 con dos estrellas verdes, una por
      Egipto y una por Siria, cuando se unieron en la República Árabe Unida. Egipto la mantuvo
      hasta 1972, y Siria la recuperó de 1980 a 2024.
    en: >-
      The stripes of the flag of Egypt's 1952 revolution with two green stars, one for Egypt and
      one for Syria, when they joined in the United Arab Republic. Egypt kept it until 1972, and
      Syria brought it back from 1980 to 2024.
  sy:
    ca: >-
      La bandera de la República Siriana des del 1930, sota el mandat francès, i de la
      independència, el 1946. Es va deixar de fer servir el 1963, l'oposició la va fer seva durant
      la guerra civil, i torna a ser la de Síria des de la caiguda del règim d'Al-Assad, el
      desembre del 2024.
    es: >-
      La bandera de la República Siria desde 1930, bajo el mandato francés, y de la independencia,
      en 1946. Dejó de usarse en 1963, la oposición la hizo suya durante la guerra civil, y vuelve
      a ser la de Siria desde la caída del régimen de al-Asad, en diciembre de 2024.
    en: >-
      The flag of the Syrian Republic from 1930, under the French mandate, and at independence in
      1946. It was dropped in 1963, the opposition took it up during the civil war, and it has
      been Syria's flag again since the fall of the Assad regime in December 2024.

