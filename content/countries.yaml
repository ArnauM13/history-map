# El nom de cada estat o territori, per codi de Gleditsch i Ward (el `gwcode` de les fronteres
# de CShapes 2.0 que hi ha a public/data/).
#
# Un codi porta un sol nom, en els tres idiomes:
#
#   "220": { ca: França, es: Francia, en: France, wiki: France }
#
# o, si el nom va canviar, una llista per ordre. `until` és l'últim dia d'un nom; l'últim no en
# porta:
#
#   "365":
#     - { until: 1917-03-14, ca: Imperi Rus, es: Imperio ruso, en: Russian Empire, wiki: Russian Empire }
#     - { ca: Rússia, es: Rusia, en: Russia, wiki: Russia }
#
# `wiki` és la font: l'article de la Viquipèdia anglesa sobre l'estat amb aquell nom (els títols
# en català i castellà els treu `npm run data:sources`). Cada nom n'ha de portar un.
#
# Són etiquetes de mapa: curtes. La història va als fets i als conflictes.

