# Names of states and territories, keyed by Gleditsch & Ward code (the `gwcode`
# used by the CShapes 2.0 border data in public/data/).
#
# A key maps either to one name in several languages:
#
#   "220": { ca: França, es: Francia, en: France }
#
# or, when the name changed over time, to a chronological list. `until` is the
# last day (inclusive) a name applies; the last entry has no `until`:
#
#   "365":
#     - { until: 1917-03-14, ca: Imperi Rus, es: Imperio ruso, en: Russian Empire }
#     - { ca: Rússia, es: Rusia, en: Russia }
#
# Names are short map labels. Details belong in events and conflicts.

